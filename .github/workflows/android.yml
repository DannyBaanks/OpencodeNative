name: Android (iSyCode Móvil)

# Builds the Android app: Kotlin + Compose on top of the SAME native bridge the
# iOS app ships (Sources/Model/GUSLlamaBridge.c), compiled with the NDK against
# llama.cpp pinned in scripts/build-llama-xcframework.sh.

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'Catalog/**'
      - 'Sources/Model/GUSLlamaBridge.*'
      - 'Sources/Diagnostics/GUSSignalTrap.*'
      - 'scripts/build-llama-xcframework.sh'
      - 'scripts/gus_catalog/generate.py'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'Catalog/**'
      - 'Sources/Model/GUSLlamaBridge.*'
      - 'Sources/Diagnostics/GUSSignalTrap.*'
      - 'scripts/build-llama-xcframework.sh'
      - 'scripts/gus_catalog/generate.py'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests (JVM)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Catalog is current (Swift + Kotlin)
        run: python3 scripts/gus_catalog/generate.py --check
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        working-directory: android/ISyCodeMovil
        run: ./gradlew :app:testDebugUnitTest --stacktrace
      - name: Fail if no tests ran
        run: grep -l 'tests="[1-9]' android/ISyCodeMovil/app/build/test-results/testDebugUnitTest/*.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-results
          path: android/ISyCodeMovil/app/build/test-results/testDebugUnitTest/
          retention-days: 14

  build:
    name: Build APK (arm64, llama.cpp via NDK)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: NDK on the runner
        id: ndk
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          echo "NDK: $NDK"
          echo "version=$(basename "$NDK")" >> "$GITHUB_OUTPUT"
      - name: Assemble debug APK
        working-directory: android/ISyCodeMovil
        run: ./gradlew :app:assembleDebug -Pgus.ndkVersion=${{ steps.ndk.outputs.version }} --stacktrace
      - name: Check the APK carries the native engine
        run: |
          APK=$(find android/ISyCodeMovil/app/build/outputs/apk/debug -name "*.apk" | head -1)
          test -n "$APK" || { echo "::error::APK not found"; exit 1; }
          ls -la "$APK"
          unzip -l "$APK" | grep -E "lib/arm64-v8a/libgus_jni.so" || { echo "::error::libgus_jni.so missing"; exit 1; }
          if unzip -l "$APK" | grep -qi "\.gguf"; then echo "::error::model weights must not be bundled"; exit 1; fi
          mkdir -p dist && cp "$APK" dist/iSyCodeMovil-android-debug.apk
          (cd dist && sha256sum iSyCodeMovil-android-debug.apk > SHA256SUMS-android.txt && cat SHA256SUMS-android.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: iSyCodeMovil-android-apk
          path: dist/
          retention-days: 30
