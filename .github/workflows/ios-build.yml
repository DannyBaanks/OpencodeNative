name: iOS Build (unsigned IPA)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  SCHEME: OpencodeNative

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Install XcodeGen
        run: brew install xcodegen
      
      - name: Generate Xcode project
        run: xcodegen generate
      
      - name: Show Xcode version
        run: xcodebuild -version
      
      - name: List schemes
        run: xcodebuild -list
      
      - name: Build unsigned (verbose)
        run: |
          xcodebuild \
            -scheme ${{ env.SCHEME }} \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath /tmp/opencodenative_dd \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY= \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tail -100
      
      - name: Verify .app structure
        run: |
          APP_PATH=$(find /tmp/opencodenative_dd -name "OpencodeNative.app" -type d | head -1)
          echo "App path: $APP_PATH"
          ls -la "$APP_PATH/"
          echo "---"
          file "$APP_PATH/OpencodeNative" || echo "Executable not found"
      
      - name: Find .app
        id: find_app
        run: |
          APP_PATH=$(find /tmp/opencodenative_dd -name "OpencodeNative.app" -type d | head -1)
          echo "app_path=$APP_PATH" >> $GITHUB_OUTPUT
      
      - name: Create unsigned IPA
        run: |
          mkdir -p Payload
          cp -R "${{ steps.find_app.outputs.app_path }}" Payload/
          zip -r OpencodeNative-unsigned.ipa Payload
      
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: OpencodeNative-unsigned
          path: OpencodeNative-unsigned.ipa
          retention-days: 30

  test:
    name: Run unit tests (iOS Simulator)
    runs-on: macos-latest
    timeout-minutes: 25
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show available Simulator destinations
        run: xcrun simctl list devices available | head -40

      - name: Run tests
        run: |
          set -o pipefail
          # Resolve a concrete iPhone on the latest iOS runtime installed on the runner.
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          ios_phones = []
          for runtime, devices in d.get('devices', {}).items():
            if 'iOS' not in runtime:
              continue
            for dev in devices:
              if dev.get('isAvailable') and 'iPhone' in dev.get('name',''):
                ios_phones.append(dev['udid'])
          print(ios_phones[0] if ios_phones else '')
          ")
          if [ -z "$UDID" ]; then
            echo "::error::No iPhone simulator available on the runner."
            xcrun simctl list devices available | head -40
            exit 1
          fi
          echo "Resolved simulator UDID: $UDID"

          # Clean derived data before testing to avoid "Multiple commands produce" errors
          rm -rf /tmp/opencodenative_dd_test

          xcodebuild test \
            -scheme OpencodeNative \
            -destination "id=$UDID" \
            -derivedDataPath /tmp/opencodenative_dd_test \
            -disableAutomaticPackageResolution \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee test-output.log

      - name: Fail if tests did not run
        run: |
          cat test-output.log | tr -d '\r' | sed $'s/\x1b\[[0-9;]*m//g' > test-output-clean.log
          grep -E "(Executed [0-9]+ test|TEST (FAILED|PASSED))" test-output-clean.log || (echo "::error::No tests executed" && exit 1)

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: test-output.log
          retention-days: 14

  capability-report:
    name: Generate capability report
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 5
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Generate capability matrix
        run: |
          cat > CAPABILITY_MATRIX.md << 'EOF'
          # Capability Matrix - OpencodeNative iOS
          
          > Generada por CI. Para evidencia completa ver `docs/OPENCODE_COMPAT.md`.
          
          ## OpenCode TUI Compatibility (anomalyco/opencode@dev, MIT)
          
          | Req OpenCode | Estado iOS | Evidence |
          |---|---|---|
          | Binario iOS OpenCode | ❌ IMPOSIBLE | `install` script: solo linux/darwin/win × {x64,arm64}; `ios-*` -> reject |
          | Runtime Bun 1.3.x | ❌ IMPOSIBLE | Bun no publica target `ios-arm64`; JSCore/WKWebView no cubren bun:/node:/PTY |
          | PTY/TTY (@lydell/node-pty, @opentui) | ❌ IMPOSIBLE | No hay openpty/posix_openpt ni TTY raw en iOS SDK |
          | spawn/exec (cross-spawn) | ❌ IMPOSIBLE | Process/NSTask ausentes en iOS SDK; sandbox prohíbe fork/execve/posix_spawn |
          | node:fs + watch + glob | ⚠️ PARCIAL | Sources/Workspace + Sources/Tools reimplementan fs/glob en sandbox iOS |
          | @effect/sql-sqlite-bun | ⚠️ PARCIAL | SQLite del sistema via Swift; no la variante Bun |
          | tree-sitter native | ❌ IMPOSIBLE | tree-sitter-* requiere compilar para arm64-ios (sin toolchain en device) |
          | TLS + WS + mDNS | ✅ POSIBLE | URLSession + URLSessionWebSocketTask + NWListener/NWBrowser |
          | Entorno POSIX (SHELL/HOME/EDITOR) | ❌ IMPOSIBLE | No hay shell ni $HOME POSIX en iOS |
          
          ## Veredicto
          
          **BLOCKED** — el TUI real de OpenCode no arranca en iOS. Primer hard blocker:
          PTY/TTY (el renderer @opentui no puede inicializar). No se simula.
          
          ### Runtime nativo alternativo (no OpenCode) que SÍ corre en iOS
           
           | Capability | iOS | Implementación |
           |---|---|---|
           | FS sandbox (read/write/list/move/delete/create) | ✅ | `Sources/Workspace/Workspace.swift` |
           | Glob search | ✅ | `Sources/Tools/GlobMatcher.swift` (puro Swift) |
           | 8 tools de filesystem | ✅ | `Sources/Tools/FileSystemTools.swift` |
           | Agent loop async multi-turn | ✅ | `Sources/Agent/AgentLoop.swift` |
           | LLM API remoto (OpenAI-compat) | ✅ | `Sources/Model/ModelProvider.swift` |
           | Provider scripteado offline (demo/tests) | ✅ | `Sources/Model/ScriptedModelProvider.swift` |
           | Persistencia JSON + JSONL audit | ✅ | `Sources/Persistence/Persistence.swift` |
           | TUI/console-first UI (no chat) | ✅ | `Sources/UI/ConsoleView.swift` |
           | Capability matrix en runtime | ✅ | `Sources/Host/IOSCapabilityMatrix.swift` |
          
          ## Restricciones iOS (no fingidas)
          - Ejecutar código arbitrario (shell, python, git, compiladores): IMPOSIBLE
          - Operaciones fuera del sandbox: IMPOSIBLE
          - Terminal real / PTY: IMPOSIBLE
          - Code signing en Windows: requiere macOS (GitHub Actions macOS runner + iloader)
          
          ## Atribución
          OpenCode © anomalyco, MIT. OpencodeNative NO es OpenCode y no está afiliado.
          EOF
      
      - name: Upload capability report
        uses: actions/upload-artifact@v4
        with:
          name: capability-report
          path: CAPABILITY_MATRIX.md

  sign:
    name: Sign IPA with iloader (optional)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    # Solo corre si el repo tiene el var ENABLE_ILOADER_SIGN='true' y los secrets APPLE_ID/TEAM_ID configurados.
    if: ${{ vars.ENABLE_ILOADER_SIGN == 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download unsigned IPA
        uses: actions/download-artifact@v4
        with:
          name: OpencodeNative-unsigned
          path: ipa

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install iloader
        run: |
          python -m pip install --upgrade pip
          pip install --user iloader

      - name: Sign IPA
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          test -n "$APPLE_ID" || { echo "::error::Secret APPLE_ID missing"; exit 1; }
          test -n "$TEAM_ID"  || { echo "::error::Secret TEAM_ID missing"; exit 1; }
          python -m iloader sign \
            --apple-id "$APPLE_ID" \
            --team-id "$TEAM_ID" \
            ipa/OpencodeNative-unsigned.ipa \
            -o OpencodeNative-signed.ipa

      - name: Upload signed IPA
        uses: actions/upload-artifact@v4
        with:
          name: OpencodeNative-signed
          path: OpencodeNative-signed.ipa
          retention-days: 30