name: iOS Build (unsigned IPA)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PROJECT_PATH: OpencodeNative
  SCHEME: OpencodeNative
  BUNDLE_ID: com.opencode.native

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Install XcodeGen
        run: brew install xcodegen
      
      - name: Generate Xcode project
        working-directory: ${{ env.PROJECT_PATH }}
        run: xcodegen generate
      
      - name: Show Xcode version
        run: xcodebuild -version
      
      - name: Build unsigned
        working-directory: ${{ env.PROJECT_PATH }}
        run: |
          xcodebuild \
            -scheme ${{ env.SCHEME }} \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath /tmp/opencodenative_dd \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY= \
            CODE_SIGNING_REQUIRED=NO \
            -quiet \
            build
      
      - name: Find .app
        id: find_app
        run: |
          APP_PATH=$(find /tmp/opencodenative_dd -name "OpencodeNative.app" -type d | head -1)
          echo "app_path=$APP_PATH" >> $GITHUB_OUTPUT
      
      - name: Create unsigned IPA
        run: |
          mkdir -p Payload
          cp -R "${{ steps.find_app.outputs.app_path }}" Payload/
          zip -r OpencodeNative-unsigned.ipa Payload
      
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: OpencodeNative-unsigned
          path: OpencodeNative-unsigned.ipa
          retention-days: 30

  test:
    name: Swift syntax check
    runs-on: macos-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Swift syntax check
        working-directory: ${{ env.PROJECT_PATH }}
        run: |
          # Quick syntax validation
          find Sources -name "*.swift" -exec swiftc -parse {} \;
          echo "Syntax OK"

  capability-report:
    name: Generate capability report
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 5
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Generate capability matrix
        run: |
          cat > CAPABILITY_MATRIX.md << 'EOF'
          # Capability Matrix - OpencodeNative iOS
          
          | Capability | iOS | Implementación | Restricción | Evidencia |
          |---|---|---|---|---|
          | Leer archivos | ✅ | FileManager + IOSWorkspace | Solo sandbox (App Support, Documents, tmp) | `Workspace.swift:100-115` |
          | Escribir archivos | ✅ | FileManager.write | Solo directorios escribibles | `Workspace.swift:117-128` |
          | Listar directorios | ✅ | contentsOfDirectory | Solo sandbox | `Workspace.swift:75-98` |
          | Crear directorios | ✅ | createDirectory | Solo sandbox | `Workspace.swift:130-133` |
          | Mover archivos | ✅ | moveItem | Solo sandbox | `Workspace.swift:143-156` |
          | Borrar archivos | ✅ | removeItem | Solo sandbox | `Workspace.swift:158-168` |
          | Buscar archivos (glob) | ✅ | Implementado en Swift (NSRegularExpression) | Sin regex, glob patterns | `FileSystemTools.swift:280-310` |
          | File watching | ⚠️ | DispatchSource.fileSystemObject | Solo directorios propios, no recursivo profundo | No implementado |
          | Security bookmarks | ⚠️ | URL.bookmarkData | Requiere picker + entitlement | No implementado |
          | Ejecutar procesos | ❌ | IMPOSIBLE | Sin Process/NSTask, sandbox prohíbe fork/exec | Restricción fundamental iOS |
          | Shell/bash | ❌ | IMPOSIBLE | No hay terminal/PTY | Restricción fundamental iOS |
          | Git | ❌ | IMPOSIBLE | Sin libgit2 nativo | Requiere compilar o backend |
          | Python/Node | ❌ | IMPOSIBLE | No hay binarios | Solo JS en WKWebView |
          | Compilar código | ❌ | IMPOSIBLE | Sin toolchain | Requiere backend externo |
          | Model API remoto | ✅ | URLSession + async/await | Red, latencia, API keys | `ModelProvider.swift:RemoteModelProvider` |
          | Model CoreML | ✅ | CoreML + .mlpackage | Modelos <2GB, solo inference | No implementado aún |
          | Persistencia JSON | ✅ | JSONEncoder + App Support | Ilimitado hasta storage | `Persistence.swift:IOSPersistence` |
          | Persistencia JSONL | ✅ | Append-only events | Rotación diaria | `Persistence.swift:180-210` |
          | Red localhost | ✅ | NWListener (Network.framework) | Solo 127.0.0.1 | `LocalPackHTTPServer` pattern |
          | Red externa | ✅ | URLSession | ATS, certificados | `ModelProvider.swift` |
          | WKWebView JS | ✅ | WebKit | Solo JS/WASM, sin filesystem directo | `WebRmmzRuntime` pattern |
          | Code signing | ❌ Windows | Requiere macOS | Solo GitHub Actions (unsigned) | `ios-build.yml` |
          
          ## Resumen
          - **Totalmente posibles**: 10
          - **Posibles con restricciones**: 4  
          - **Requieren abstracción**: 2
          - **Imposibles directamente**: 5
          - **Necesitan backend externo**: 4
          
          ## Conclusión experimental
          Un runtime tipo OpenCode **SÍ puede ejecutarse nativamente en iOS** para:
          - Operaciones de filesystem completas dentro del sandbox
          - Agent loop completo con tools declaradas
          - Model providers via API remota
          - Persistencia local completa
          - UI nativa SwiftUI
          
          **NO puede** (sin backend externo):
          - Ejecutar código arbitrario (shell, python, git, compiladores)
          - Operaciones fuera del sandbox
          - Terminal real / PTY
          - Code signing en Windows
          
          La arquitectura resultante es: **Agent Runtime + Tools declaradas + Model Provider (remoto/local) + Sandbox Filesystem**
          EOF
      
      - name: Upload capability report
        uses: actions/upload-artifact@v4
        with:
          name: capability-report
          path: CAPABILITY_MATRIX.md