name: OpencodeNative
options:
  bundleIdPrefix: com.opencode
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    PRODUCT_NAME: OpencodeNative
    GENERATE_INFOPLIST_FILE: NO
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.1.0"

targets:
  OpencodeNativeCore:
    type: framework.static
    platform: iOS
    sources:
      - path: Sources
        type: group
        excludes:
          - OpencodeNativeApp.swift
    settings:
      base:
        PRODUCT_NAME: OpencodeNativeCore
        PRODUCT_BUNDLE_IDENTIFIER: com.opencode.native.core
        DEFINES_MODULE: YES
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        SKIP_INSTALL: YES

  OpencodeNative:
    type: application
    platform: iOS
    sources:
      - path: App
        type: group
      - path: Assets.xcassets
      - path: LocalPacks
        type: folder
    dependencies:
      - target: OpencodeNativeCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.opencode.native
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGNING_REQUIRED: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Info.plist

  OpencodeNativeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        type: group
    dependencies:
      - target: OpencodeNativeCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.opencode.native.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO

schemes:
  OpencodeNative:
    build:
      targets:
        OpencodeNativeCore: all
        OpencodeNative: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - OpencodeNativeTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
