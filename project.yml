name: OpencodeNative
options:
  bundleIdPrefix: com.opencode
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    PRODUCT_NAME: OpencodeNative
    GENERATE_INFOPLIST_FILE: NO
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.1.0"

targets:
  OpencodeNative:
    type: application
    platform: iOS
    sources:
      - path: Sources
        type: group
      - path: Assets.xcassets
      - path: LocalPacks
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.opencode.native
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGNING_REQUIRED: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Info.plist